map $host $send_to_main {
    default                       0;
    www.straighttalkpharmacist.com    1;
    straighttalkpharmacist.online     1;
    www.straighttalkpharmacist.online 1;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    if ($send_to_main) { return 301 https://straighttalkpharmacist.com$request_uri; }
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    location ~* \.(jpg|png|webp)$ { expires 30d; }
    location / { try_files $uri $uri/ /index.html; }
}
